name: Documentation

on:
  push:
    branches: [main]
    paths: ['docs/**', 'ckdocs.yml', 'scripts/build-docs.sh', '.ckgit/**', '.github/workflows/pages.yml']
  pull_request:
    branches: [main]
    paths: ['docs/**', 'ckdocs.yml', 'scripts/build-docs.sh', '.ckgit/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true

env:
  CKDOCS_REPOSITORY: cklukas/ck-git-hosting
  CKDOCS_VERSION: 0.11.0
  CKDOCS_SHA256: f3166afa2f12b69503e248a08b8c0313a1331f3e481b7c5f380db03eef64c8a6

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@v5
      - name: Install release ckdocs
        run: |
          deb="$RUNNER_TEMP/ckdocs_${CKDOCS_VERSION}_amd64.deb"
          curl --fail --location --silent --show-error --retry 3 --output "$deb" \
            "https://github.com/$CKDOCS_REPOSITORY/releases/download/v$CKDOCS_VERSION/ckdocs_${CKDOCS_VERSION}_amd64.deb"
          echo "$CKDOCS_SHA256  $deb" | sha256sum --check --strict
          sudo dpkg --install "$deb"
          ckdocs --version
          ckdocs --version | grep -F "ckdocs $CKDOCS_VERSION"
      - name: Build and verify documentation
        run: |
          scripts/build-docs.sh "$(command -v ckdocs)" \
            "$RUNNER_TEMP/apps-docs-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            "$RUNNER_TEMP/site-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            https://cklukas.github.io/ck-core-apps/
          cat "$RUNNER_TEMP/apps-docs-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/receipt.txt"
      - name: Configure Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/site-${{ github.run_id }}-${{ github.run_attempt }}

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v5
