version: 1
on:
  branches: [main]
  tags: [v*]
runs_on: primary
sisters:
  - name: ck-git-hosting
    # ckdocs v0.11.0
    ref: fbe21b49d6c5d5afebffa3d3de745351e07c6b5e
  - name: ck-core-motif
    ref: master
  - name: ck-core-cde
    ref: master
jobs:
  - name: documentation
    steps:
      - name: documentation-site
        script: |
          set -eu
          export GIT_CONFIG_NOSYSTEM=1
          test -n "$TMPDIR"
          test -n "$CKGIT_SISTER_CK_GIT_HOSTING"
          run_id="$(git rev-parse --short=12 HEAD 2>/dev/null || printf '%.12s' "${CKGIT_COMMIT:-unknown}")"
          rm -rf "$TMPDIR/apps-docs-$run_id" public
          scripts/build-docs.sh "$CKGIT_SISTER_CK_GIT_HOSTING" \
            "$TMPDIR/apps-docs-$run_id" "$PWD/public" \
            http://rpi4:8421/ck-core-apps/
          mkdir -p docs-evidence
          cp "$TMPDIR/apps-docs-$run_id/receipt.txt" docs-evidence/receipt.txt
    artifacts:
      name: documentation-evidence
      paths: [docs-evidence]
  - name: build
    steps:
      - name: latest-motif-cde-native-apps
        script: |
          set -eu
          export GIT_CONFIG_NOSYSTEM=1
          test -n "$TMPDIR"
          test -n "$CKGIT_SISTER_CK_CORE_MOTIF"
          test -n "$CKGIT_SISTER_CK_CORE_CDE"
          if ! pkg-config --exists alsa || test ! -f /usr/include/lmdb.h; then
            echo "runner needs libasound2-dev and liblmdb-dev before the native build" >&2
            exit 1
          fi
          if ! command -v gcc-14 >/dev/null 2>&1 || ! command -v g++-14 >/dev/null 2>&1 || ! command -v localedef >/dev/null 2>&1; then
            echo "runner needs gcc-14, g++-14, and locales (localedef) before the native build" >&2
            exit 1
          fi
          run_id="$(git rev-parse --short=12 HEAD 2>/dev/null || printf '%.12s' "${CKGIT_COMMIT:-unknown}")"
          rm -rf "$TMPDIR/apps-$run_id" "$TMPDIR/apps-out-$run_id"
          scripts/build-native.sh \
            "$CKGIT_SISTER_CK_CORE_MOTIF" \
            "$CKGIT_SISTER_CK_CORE_CDE" \
            "$TMPDIR/apps-$run_id" \
            "$TMPDIR/apps-out-$run_id"
          mkdir -p build-evidence
          cp "$TMPDIR/apps-$run_id/receipt.txt" build-evidence/receipt.txt
    artifacts:
      name: native-build-evidence
      paths: [build-evidence]
pages:
  path: public
